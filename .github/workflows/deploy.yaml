name: Deploy to GitHub Pages

on:
  push:
    branches: [Revamp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_LASTFM_USER: ${{ vars.PUBLIC_LASTFM_USER }}
      PUBLIC_LASTFM_API_KEY: ${{ vars.PUBLIC_LASTFM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and upload
        uses: withastro/action@v6
        with:
          path: ./psta-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5